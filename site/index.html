<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проверка математики</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #172033; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 960px); text-align: center; }
    .card { background: #fff; border-radius: 20px; box-shadow: 0 12px 36px rgba(28, 46, 82, .14); padding: 42px 32px; }
    .progress { color: #64748b; font-size: .95rem; margin: 0 0 18px; }
    h1 { margin: 0 0 16px; font-size: clamp(1.8rem, 5vw, 2.5rem); }
    h2 { margin: 0 0 12px; font-size: 1.4rem; }
    .subtitle { color: #64748b; margin: 0 0 24px; }
    .question { margin: 0 0 28px; font-size: clamp(1.35rem, 4vw, 1.8rem); background: #f0fdf4; border-radius: 12px; padding: 18px 16px; }
    .equation { display: block; margin-top: 10px; font-weight: 700; }
    .tag { display: inline-block; margin: 0 0 12px; padding: 4px 12px; border-radius: 999px; font-size: .8rem; font-weight: 700; background: #e9efff; color: #173b8c; }
    .tag-dota { background: #fee2e2; color: #b91c1c; }
    .tag-tema { background: #dcfce7; color: #166534; }
    .tag-word { background: #fef9c3; color: #854d0e; }
    .question-image { display: block; width: 100%; max-width: 280px; height: auto; margin: 14px auto 0; border-radius: 12px; background: #0f172a; }
    .result-thumb { display: block; margin-top: 8px; max-width: 120px; height: auto; border-radius: 8px; }
    .answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    button { border: 0; border-radius: 12px; background: #e9efff; color: #173b8c; cursor: pointer; font-size: 1.15rem; font-weight: 700; padding: 17px; transition: background .2s, transform .2s; }
    button:hover, button:focus-visible { background: #ccdafe; transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid #5d8eff; outline-offset: 2px; }
    .result-list { display: grid; gap: 12px; text-align: left; }
    .result { border-radius: 12px; padding: 14px 16px; font-size: 1rem; line-height: 1.45; }
    .correct { background: #dcfce7; color: #166534; }
    .incorrect { background: #fee2e2; color: #b91c1c; }
    .result p { margin: 0; }
    .score { font-size: 1.2rem; margin: 0 0 24px; }
    .restart { margin-top: 26px; background: #2563eb; color: #fff; }
    .restart:hover, .restart:focus-visible { background: #1d4ed8; }
    .choice-main { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .choice-tema { margin-top: 14px; display: grid; }
    .choice-btn { display: block; width: 100%; padding: 22px; font-size: 1.5rem; }
    .choice-btn small { display: block; margin-top: 6px; font-size: .9rem; font-weight: 400; opacity: .8; }
    .btn-roma { background: #e9efff; }
    .btn-tema { background: #dcfce7; color: #166534; }
    .btn-tema:hover, .btn-tema:focus-visible { background: #bbf7d0; }
    .btn-konspekt { background: #fef9c3; color: #854d0e; }
    .btn-konspekt:hover, .btn-konspekt:focus-visible { background: #fde68a; }
    .toc { background: #f8fafc; border-radius: 12px; padding: 14px 18px; margin: 0 0 16px; text-align: left; line-height: 1.7; font-size: 1rem; }
    .toc b { display: block; margin-bottom: 6px; }
    .toc a { color: #2563eb; text-decoration: none; font-weight: 700; }
    .toc a:hover { text-decoration: underline; }
    .konspekt h3 { margin: 22px 0 10px; font-size: 1.15rem; }
    .konspekt h3:first-of-type { margin-top: 0; }
    .konspekt ul, .konspekt ol { margin: 8px 0 10px; padding-left: 22px; line-height: 1.55; font-size: 1.02rem; }
    .konspekt li { margin-bottom: 6px; }
    .example { background: #fffbeb; border: 2px solid #fde68a; border-radius: 12px; padding: 14px 16px; font-size: 1.02rem; line-height: 1.55; margin: 0 0 14px; }
    .lesson { text-align: left; }
    .lesson h2 { text-align: center; }
    .theory { background: #f8fafc; border-radius: 12px; padding: 16px 18px; font-size: 1.05rem; line-height: 1.55; margin: 0 0 14px; }
    .theory p { margin: 0 0 10px; }
    .theory p:last-child { margin-bottom: 0; }
    .formula { display: block; margin-top: 8px; padding: 10px; background: #fff; border-radius: 8px; font-weight: 700; text-align: center; }
    .task-box { background: #fffbeb; border: 2px solid #fde68a; border-radius: 12px; padding: 16px 18px; font-size: 1.05rem; line-height: 1.5; margin: 0 0 14px; }
    .answer-box { background: #dcfce7; border-radius: 12px; padding: 16px 18px; font-size: 1.05rem; line-height: 1.5; margin: 0 0 14px; }
    .answer-hidden { display: none; }
    .show-answer { width: 100%; background: #fef3c7; color: #92400e; font-size: 1rem; padding: 13px; }
    .show-answer:hover, .show-answer:focus-visible { background: #fde68a; }
    .nav { display: flex; gap: 12px; margin-top: 18px; }
    .nav button { flex: 1; font-size: 1rem; padding: 14px; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover, .btn-secondary:focus-visible { background: #cbd5e1; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover, .btn-primary:focus-visible { background: #1d4ed8; }
    .to-start { margin-top: 14px; width: 100%; background: transparent; color: #64748b; font-size: .95rem; font-weight: 400; padding: 10px; }
    .to-start:hover, .to-start:focus-visible { background: #f1f5f9; transform: none; }
    .pic { background: #fff; border: 2px dashed #cbd5e1; border-radius: 12px; padding: 14px; margin: 0 0 14px; }
    .pic-caption { font-size: .9rem; color: #64748b; text-align: center; margin: 8px 0 0; }
    .bar-row { margin: 10px 0; text-align: left; font-size: .95rem; }
    .bar-label { font-weight: 700; margin-bottom: 4px; }
    .bar-track { background: #e2e8f0; border-radius: 8px; overflow: hidden; display: flex; height: 30px; }
    .bar-fill { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: .85rem; white-space: nowrap; }
    .bar-blue { background: #3b82f6; }
    .bar-green { background: #22c55e; }
    .bar-orange { background: #f59e0b; }
    .bar-red { background: #ef4444; }
    .bar-grey { background: #cbd5e1; color: #64748b; }
    .formula-pic { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; font-weight: 700; font-size: 1rem; }
    .chip { background: #eef2ff; border-radius: 10px; padding: 10px 12px; text-align: center; }
    .chip small { display: block; font-weight: 400; color: #64748b; margin-top: 4px; }
    .chip-green { background: #dcfce7; }
    .chip-yellow { background: #fef9c3; }
    .vs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .vs-col { border-radius: 10px; padding: 10px; background: #f8fafc; text-align: center; font-size: .95rem; line-height: 1.5; }
    .vs-col b { display: block; margin-bottom: 4px; }
    .lang-switch { display: flex; gap: 8px; justify-content: center; margin: 0 0 12px; }
    .lang-btn { padding: 10px 22px; font-size: 1rem; background: #e2e8f0; color: #334155; }
    .lang-btn.active { background: #2563eb; color: #fff; }
    .cheat { background: #f0fdf4; border: 2px solid #bbf7d0; border-radius: 12px; padding: 16px 18px; margin: 0 0 16px; }
    .cheat h3 { margin: 0 0 10px; }
    .cheat .formula { margin-bottom: 8px; }
    .hint { text-align: center; color: #64748b; font-size: .92rem; margin: 0 0 14px; }
    .back-top { margin: 0 0 14px; width: auto; padding: 10px 18px; font-size: .95rem; background: #e2e8f0; color: #334155; }
    .back-top:hover, .back-top:focus-visible { background: #cbd5e1; }
    .konspekt-layout { display: grid; grid-template-columns: 230px 1fr; gap: 18px; align-items: start; }
    .k-side { position: sticky; top: 16px; background: #f8fafc; border-radius: 12px; padding: 14px; text-align: left; font-size: .95rem; line-height: 1.6; display: grid; gap: 10px; }
    .k-btn { display: block; text-align: center; background: #e9efff; color: #173b8c; text-decoration: none; font-weight: 700; border-radius: 10px; padding: 12px 10px; transition: background .2s, transform .2s; }
    .k-btn:hover, .k-btn:focus-visible { background: #ccdafe; transform: translateY(-1px); }
    .k-btn-brief { background: #fef9c3; color: #854d0e; }
    .k-btn-brief:hover, .k-btn-brief:focus-visible { background: #fde68a; }
    .k-btn.active { background: #2563eb; color: #fff; }
    .k-btn-brief.active { background: #b45309; color: #fff; }
    .k-main { min-width: 0; }
    .formula-line { display: block; margin-top: 8px; padding: 10px; background: #fff; border-radius: 8px; font-weight: 700; text-align: center; }
    .fbook { background: #fff; border-radius: 10px; padding: 14px 12px; margin: 10px 0; text-align: center; font-size: 1.3rem; line-height: 2.2; }
    .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 6px; font-size: .95em; }
    .frac .fnum { padding: 0 10px; }
    .frac .fden { border-top: 2px solid #172033; padding: 0 10px; }
    .sqrt { display: inline-block; white-space: nowrap; }
    .sqrt .rad { font-size: 1.05em; }
    .sqrt .rbody { border-top: 2px solid #172033; padding: 0 5px 0 1px; }
    .term { border-bottom: none; text-decoration: none; cursor: help; position: relative; }
    .term:hover, .term:focus { background: #fef9c3; border-radius: 4px; }
    .term:hover::after, .term:focus::after { content: attr(data-tip); position: absolute; left: 50%; transform: translateX(-50%); bottom: 135%; background: #0f172a; color: #fff; padding: 6px 10px; border-radius: 8px; font-size: .85rem; font-weight: 700; white-space: nowrap; z-index: 20; pointer-events: none; }
    .solution-box { background: #eff6ff; border: 2px solid #bfdbfe; border-radius: 12px; padding: 16px 18px; font-size: 1.05rem; line-height: 1.55; margin: 14px 0 0; text-align: left; }
    .fail-title { color: #b91c1c; }
    .win-title { color: #166534; }
    @media (max-width: 760px) { .konspekt-layout { grid-template-columns: 1fr; } .k-side { position: static; } }
    @media (max-width: 640px) { .choice-main { grid-template-columns: 1fr; } }
    @media (max-width: 420px) { .card { padding: 30px 20px; } .answers { grid-template-columns: 1fr; } .nav { flex-direction: column; } .vs-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script>
    // ===== Рома: квиз (математика + слова + Dota). Стоп на первой ошибке. =====
    const questions = [
      { kind: 'math', text: 'Чему равен дискриминант уравнения', equation: 'x² − 5x + 6 = 0?', options: ['1', '5', '25', '49'], correct: '1', solution: 'D = b² − 4ac = (−5)² − 4·1·6 = 25 − 24 = 1.' },
      { kind: 'word', text: 'Как по-английски «свободный член»?', options: ['constant term', 'leading term', 'middle term', 'root'], correct: 'constant term', solution: 'Свободный член — число без x (c). По-английски — constant term. Leading term — старший член, middle term — средний.' },
      { kind: 'math', text: 'Сколько корней имеет квадратное уравнение, если', equation: 'D < 0?', options: ['0', '1', '2', 'Бесконечно много'], correct: '0', solution: 'Если D < 0, корней нет — 0. D > 0 → 2 корня, D = 0 → 1 корень.' },
      { kind: 'math', text: 'Какие корни уравнения', equation: 'x² − 9 = 0?', options: ['−3 и 3', '0 и 9', '3 и 6', '−9 и 9'], correct: '−3 и 3', solution: 'x² = 9, x = ±3. Проверка: 3² − 9 = 0 и (−3)² − 9 = 0.' },
      { kind: 'word', text: 'Что такое «leading term» по-русски?', options: ['старший член', 'свободный член', 'корень', 'дискриминант'], correct: 'старший член', solution: 'Leading term — старший (главный) член ax², член с x². Constant term — свободный член.' },
      { kind: 'dota', text: 'Какой герой изображён на картинке?', image: 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/pudge.png', imageAlt: 'Герой Dota 2', options: ['Pudge', 'Invoker', 'Axe', 'Juggernaut'], correct: 'Pudge', solution: 'На картинке Pudge — герой с хуком и большим животом.' },
      { kind: 'math', text: 'Сколько разных корней у квадратного уравнения, если', equation: 'D = 0?', options: ['0', '1', '2', '3'], correct: '1', solution: 'При D = 0 корень один (совпавший): x = −b / 2a.' },
      { kind: 'math', text: 'Чему равен дискриминант уравнения', equation: 'x² + 4x + 4 = 0?', options: ['0', '8', '16', '32'], correct: '0', solution: 'D = 4² − 4·1·4 = 16 − 16 = 0.' },
      { kind: 'word', text: 'Как по-английски «средний член»?', options: ['middle term', 'constant term', 'leading term', 'sum of roots'], correct: 'middle term', solution: 'Средний член bx (член с x) — middle term (linear term). Constant term — свободный член.' },
      { kind: 'math', text: 'Какие корни уравнения', equation: 'x² − 5x + 6 = 0?', options: ['2 и 3', '−2 и −3', '1 и 6', '−1 и −6'], correct: '2 и 3', solution: 'По Виету: сумма 5, произведение 6. Это 2 и 3: 2+3=5, 2·3=6.' },
      { kind: 'dota', text: 'Что делает предмет на картинке?', image: 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/blink.png', imageAlt: 'Предмет Blink Dagger', options: ['Телепортирует героя на короткую дистанцию', 'Даёт невидимость', 'Лечит 500 HP', 'Даёт иммунитет к магии'], correct: 'Телепортирует героя на короткую дистанцию', solution: 'Blink Dagger — телепортация (бdecлинк) на короткую дистанцию.' },
      { kind: 'math', text: 'Чему равно произведение корней уравнения', equation: 'x² − 5x + 6 = 0?', options: ['6', '−6', '5', '−5'], correct: '6', solution: 'По Виету для x²+px+q=0 произведение = q = 6. Сумма = 5.' },
      { kind: 'word', text: 'Что такое «constant term» по-русски?', options: ['свободный член', 'старший член', 'средний член', 'сумма корней'], correct: 'свободный член', solution: 'Constant term — свободный член c, число без x.' },
      { kind: 'math', text: 'Какие корни уравнения', equation: 'x² − 4x = 0?', options: ['0 и 4', '0 и −4', '2 и 2', '−2 и 2'], correct: '0 и 4', solution: 'x(x − 4) = 0, значит x = 0 или x = 4. Свободного члена здесь нет (c = 0).' },
      { kind: 'math', text: 'Какие корни уравнения', equation: 'x² − 25 = 0?', options: ['−5 и 5', '0 и 5', '−25 и 25', '5 и 10'], correct: '−5 и 5', solution: 'x² = 25, x = ±5. Среднего члена нет (b = 0).' },
      { kind: 'dota', text: 'Угадай героя по картинке', image: 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/juggernaut.png', imageAlt: 'Герой Dota 2', options: ['Juggernaut', 'Axe', 'Sven', 'Phantom Assassin'], correct: 'Juggernaut', solution: 'На картинке Juggernaut — герой с маской и катаной.' },
      { kind: 'math', text: 'Какие корни уравнения', equation: '2x² + 3x + 1 = 0?', options: ['−1 и −0,5', '1 и 0,5', '−2 и −1', '0 и −1'], correct: '−1 и −0,5', solution: 'D = 9 − 8 = 1, x = (−3 ± 1)/4: x₁ = −1, x₂ = −0,5.' },
      { kind: 'word', text: 'Как по-английски «старший коэффициент»?', options: ['leading coefficient', 'constant term', 'middle term', 'discriminant'], correct: 'leading coefficient', solution: 'Старший коэффициент a (при x²) — leading coefficient. Constant term — свободный член.' },
      { kind: 'math', text: 'Чему равен старший коэффициент уравнения', equation: '3x² − 2x + 1 = 0?', options: ['3', '−2', '1', '0'], correct: '3', solution: 'Старший коэффициент — число при x²: a = 3. b = −2, c = 1.' },
      { kind: 'math', text: 'Чему равен свободный член уравнения', equation: '3x² − 2x + 1 = 0?', options: ['1', '3', '−2', '0'], correct: '1', solution: 'Свободный член — число без x: c = 1.' },
      { kind: 'word', text: 'Что такое «sum of roots» по-русски?', options: ['сумма корней', 'произведение корней', 'свободный член', 'старший член'], correct: 'сумма корней', solution: 'Sum of roots — сумма корней x₁ + x₂. Product of roots — произведение.' },
      { kind: 'dota', text: 'Кто изображён на картинке?', image: 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/invoker.png', imageAlt: 'Герой Dota 2', options: ['Invoker', 'Zeus', 'Lina', 'Rubick'], correct: 'Invoker', solution: 'На картинке Invoker — маг с тремя сферами.' },
      { kind: 'math', text: 'Какие корни уравнения', equation: 'x² − 2x − 3 = 0?', options: ['3 и −1', '−3 и 1', '−3 и −1', '1 и 3'], correct: '3 и −1', solution: 'По Виету: сумма 2, произведение −3. Это 3 и −1: 3+(−1)=2, 3·(−1)=−3.' },
      { kind: 'word', text: 'Как по-английски «произведение корней»?', options: ['product of roots', 'sum of roots', 'constant term', 'leading term'], correct: 'product of roots', solution: 'Произведение корней x₁·x₂ — product of roots. Сумма — sum of roots.' },
      { kind: 'math', text: 'По теореме Виета сумма корней приведённого уравнения', equation: 'x² + px + q = 0 равна?', options: ['−p', 'p', 'q', '−q'], correct: '−p', solution: 'По Виету x₁ + x₂ = −p (второй коэффициент с обратным знаком).' },
      { kind: 'math', text: 'По теореме Виета произведение корней приведённого уравнения', equation: 'x² + px + q = 0 равно?', options: ['q', '−q', 'p', '−p'], correct: 'q', solution: 'По Виету x₁·x₂ = q (свободному члену).' },
      { kind: 'word', text: 'Как по-английски «теорема Виета»?', options: ["Vieta's theorem", "Pythagoras' theorem", 'discriminant', 'quadratic equation'], correct: "Vieta's theorem", solution: "Теорема Виета — Vieta's theorem (Vieta's formulas). Связывает корни и коэффициенты." },
      { kind: 'dota', text: 'Что даёт предмет на картинке?', image: 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/black_king_bar.png', imageAlt: 'Предмет Black King Bar', options: ['Невосприимчивость к большинству заклинаний', 'Телепортацию', 'Невидимость', 'Возрождение'], correct: 'Невосприимчивость к большинству заклинаний', solution: 'Black King Bar (БКБ) даёт невосприимчивость к большинству заклинаний.' },
      { kind: 'math', text: 'Какой формулой считают дискриминант', equation: 'ax² + bx + c = 0?', options: ['b² − 4ac', 'a² − 4bc', '2a + b', 'c² − ab'], correct: 'b² − 4ac', solution: 'D = b² − 4ac. Только так.' },
      { kind: 'word', text: 'Как по-английски «квадратное уравнение»?', options: ['quadratic equation', "Vieta's theorem", 'constant term', 'linear equation'], correct: 'quadratic equation', solution: 'Квадратное уравнение — quadratic equation. Linear equation — линейное.' },
      { kind: 'math', text: 'Чему равна сумма корней уравнения', equation: 'x² − 5x + 6 = 0?', options: ['5', '−5', '6', '−6'], correct: '5', solution: 'По Виету сумма = −p = 5 (p = −5). Произведение = 6.' },
      { kind: 'math', text: 'Чему равен дискриминант уравнения', equation: '2x² + 3x + 1 = 0?', options: ['1', '9', '17', '−1'], correct: '1', solution: 'D = 3² − 4·2·1 = 9 − 8 = 1.' },
      { kind: 'math', text: 'Чему равен дискриминант уравнения', equation: 'x² − 2x − 3 = 0?', options: ['16', '4', '−8', '8'], correct: '16', solution: 'D = (−2)² − 4·1·(−3) = 4 + 12 = 16.' },
      { kind: 'word', text: 'Как по-английски «корень уравнения»?', options: ['root', 'branch', 'leaf', 'coefficient'], correct: 'root', solution: 'Корень уравнения — root. Coefficient — коэффициент.' },
      { kind: 'math', text: 'Сколько корней имеет квадратное уравнение, если', equation: 'D > 0?', options: ['2', '1', '0', '3'], correct: '2', solution: 'При D > 0 два разных корня: x = (−b ± √D) / 2a.' }
    ];

    // ===== Тёма: учебник по процентам =====
    const temaLessons = [
      {
        title: 'Шаг 1. Что значит «выросла на 40%»?',

            <p><b>2. <span class="term" data-tip="средний член" tabindex="0">Middle (linear) term</span> — bx.</b> The term with x to the first power. Number <b>b</b> is called the <span class="term" data-tip="средний коэффициент" tabindex="0"><b>middle coefficient</b></span>.</p>
            <p><b>3. <span class="term" data-tip="свободный член" tabindex="0">Constant term</span> — c.</b> A plain number without x. It is «free» because it is free from the unknown x.</p>

            <span class="formula">x₁ + x₂ = −p</span>

            <p style="margin-top:10px">In words: the <span class="term" data-tip="сумма корней" tabindex="0"><b>sum of roots</b></span> equals the second coefficient with the opposite sign, and the <span class="term" data-tip="произведение корней" tabindex="0"><b>product of roots</b></span> equals the constant term.</p>
            <p><b>For a general equation ax² + bx + c = 0:</b></p>
            <span class="formula">ax² + bx + c = 0</span>
            <span class="formula">x₁ + x₂ = −b / a</span>
            <span class="formula">x₁ · x₂ = c / a</span>
            <p style="margin-top:10px">If a = 1, the second formula becomes the first one.</p>
            <p><b>Converse theorem:</b> if two numbers give −p in sum and q in product, they are the roots of x² + px + q = 0. So roots can be guessed.</p>
          </div>
          <div class="example"><b>Example:</b> x² − 5x + 6 = 0. Here p = −5, q = 6.<br>By Vieta: x₁ + x₂ = 5, x₁ × x₂ = 6.<br>Which two numbers give 5 in sum and 6 in product? They are <b>2 and 3</b>. Check: 2 + 3 = 5, 2 × 3 = 6. So the roots are 2 and 3.</div>
          <div class="theory">
            <p><b>How to use:</b></p>
            <p>1. Check that the equation is monic (a = 1). If not — divide everything by a.<br>2. Write the sum (−p) and the product (q).<br>3. Guess two numbers: start from the product (split the constant term into factors) and check the sum.<br>4. Check the roots by putting them into the equation.</p>
            <p><b>Important:</b> Vieta works only if the equation has roots (discriminant D ≥ 0). If D &lt; 0, there are no roots and there is nothing to guess.</p>
          </div>`;

    function enableWordTooltips(root) {
      if (!root) return;
      const dict = konspektLang === 'ru' ? ruToEn : enToRu;
      const skip = new Set(['ax', 'bx', 'px', 'qx', 'lt', 'gt', 'amp', 'nbsp']);
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          const p = node.parentElement;
          if (!p) return NodeFilter.FILTER_REJECT;
          if (p.closest('.term')) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      for (const node of nodes) {
        const parts = node.nodeValue.split(/([A-Za-zА-Яа-яЁё]+)/g);
        if (parts.length <= 1) continue;
        const frag = document.createDocumentFragment();
        for (const part of parts) {
          if (/^[A-Za-zА-Яа-яЁё]+$/.test(part)) {
            const low = part.toLowerCase();
            if (skip.has(low)) { frag.appendChild(document.createTextNode(part)); continue; }
            const tr = dict[low];
            if (tr) {
              const s = document.createElement('span');
              s.className = 'term';
              s.tabIndex = 0;
              s.dataset.tip = tr;
              s.textContent = part;
              frag.appendChild(s);
            } else {
              frag.appendChild(document.createTextNode(part));
            }
          } else {
            frag.appendChild(document.createTextNode(part));
          }
        }
        node.parentNode.replaceChild(frag, node);
      }
    }

    let konspektLang = 'ru';

    const sideEN = `
      <button type="button" class="k-btn" data-view="quad">Quadratic equations</button>
      <button type="button" class="k-btn" data-view="vieta">Vieta's theorem</button>
      <button type="button" class="k-btn k-btn-brief" data-view="brief">Quick notes</button>`;

    function renderKonspektLang() {
      const isRu = konspektLang === 'ru';
      const btnRu = app.querySelector('#lang-ru');
      const btnEn = app.querySelector('#lang-en');
      if (btnRu) btnRu.classList.toggle('active', isRu);
      if (btnEn) btnEn.classList.toggle('active', !isRu);
      const title = app.querySelector('#konspekt-title');
      const hint = app.querySelector('#konspekt-hint');
      const side = app.querySelector('#konspekt-side');
      const content = app.querySelector('#konspekt-content');
      if (title) title.textContent = isRu ? 'Конспект' : 'Notes';
      if (hint) hint.textContent = isRu
        ? 'Наведи мышкой на любое слово — увидишь перевод на английский'
        : 'Hover over any word to see the Russian translation';
      if (side) {
        side.innerHTML = isRu ? sideRU : sideEN;

    function startRoma() { currentQuestion = 0; showQuestion(); }
    function startTema() { currentTema = 0; showTemaLesson(); }

    function formatQuestion(question) {
      return question.equation
        ? `${question.text}<span class="equation">${question.equation}</span>`
        : question.text;
    }
    function questionImage(question, cls) {
      return question.image
        ? `<img class="${cls}" src="${question.image}" alt="${question.imageAlt || 'Картинка к вопросу'}" loading="lazy">`
        : '';
    }
    function isDota(question) { return question.kind === 'dota'; }
    function isWord(question) { return question.kind === 'word'; }
    function questionTag(question) {
      if (isDota(question)) return '<span class="tag tag-dota">DOTA 2</span>';
      if (isWord(question)) return '<span class="tag tag-word">СЛОВА / WORDS</span>';
      return '<span class="tag">МАТЕМАТИКА</span>';
    }
    function questionTitle(question) {
      if (isDota(question)) return 'Dota 2';
      if (isWord(question)) return 'Слова из конспекта';
      return 'Квадратные уравнения';
    }

    function showQuestion() {
      const question = questions[currentQuestion];
      app.innerHTML = `
        <section class="card">
          <p class="progress">Рома • Вопрос ${currentQuestion + 1} из ${questions.length} • тест идёт до первой ошибки</p>

    function chooseAnswer(answer) {
      const question = questions[currentQuestion];
      if (answer === question.correct) {
        currentQuestion += 1;
        currentQuestion < questions.length ? showQuestion() : showWin();
      } else {
        showFail(question, answer);
      }
    }

    function showFail(question, answer) {
      app.innerHTML = `
        <section class="card">
          <h1 class="fail-title">Ошибка — тест остановлен</h1>
          <p class="score">Правильных подряд: ${currentQuestion} из ${questions.length} (ошибка на вопросе ${currentQuestion + 1})</p>

            <article class="result incorrect">

            <button class="btn-primary" type="button" data-go="start">К выбору</button>
          </div>
        </section>`;
      app.querySelector('[data-go="retry"]').addEventListener('click', startRoma);

            <button class="btn-secondary" type="button" data-go="retry">Пройти ещё раз</button>
            <button class="btn-primary" type="button" data-go="start">К выбору</button>
          </div>

      app.querySelector('[data-go="retry"]').addEventListener('click', startRoma);
      app.querySelector('[data-go="start"]').addEventListener('click', showStart);

    function showTemaLesson() {
      const lesson = temaLessons[currentTema];
      const isLast = currentTema === temaLessons.length - 1;
      const isFirst = currentTema === 0;
      app.innerHTML = `
        <section class="card lesson">
          <p class="progress">Тёма • Урок ${currentTema + 1} из ${temaLessons.length}</p>
          <p style="margin: 0 0 12px; text-align:center;"><span class="tag tag-tema">ПРОЦЕНТЫ</span></p>

          <div class="theory">${lesson.theory}</div>
          ${lesson.pic ? `<div class="pic">${lesson.pic}</div>` : ''}

          <button class="to-start" type="button" id="tema-start">← К выбору Рома / Тёма</button>
        </section>`;
      const answerBox = app.querySelector('#tema-answer');
      const toggleBtn = app.querySelector('#tema-toggle');
      toggleBtn.addEventListener('click', () => {
        const hidden = answerBox.classList.toggle('answer-hidden');

      app.querySelector('#tema-prev').addEventListener('click', () => {

      app.querySelector('#tema-next').addEventListener('click', () => {
        if (isLast) { showStart(); } else { currentTema += 1; showTemaLesson(); }

      app.querySelector('#tema-start').addEventListener('click', showStart);
    }

    showStart();
