<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проверка математики</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #172033; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 620px); text-align: center; }
    .card { background: #fff; border-radius: 20px; box-shadow: 0 12px 36px rgba(28, 46, 82, .14); padding: 42px 32px; }
    .progress { color: #64748b; font-size: .95rem; margin: 0 0 18px; }
    h1 { margin: 0 0 16px; font-size: clamp(1.8rem, 5vw, 2.5rem); }
    h2 { margin: 0 0 12px; font-size: 1.4rem; }
    .subtitle { color: #64748b; margin: 0 0 24px; }
    .question { margin: 0 0 28px; font-size: clamp(1.35rem, 4vw, 1.8rem); background: #f0fdf4; border-radius: 12px; padding: 18px 16px; }
    .equation { display: block; margin-top: 10px; font-weight: 700; }
    .tag { display: inline-block; margin: 0 0 12px; padding: 4px 12px; border-radius: 999px; font-size: .8rem; font-weight: 700; background: #e9efff; color: #173b8c; }
    .tag-dota { background: #fee2e2; color: #b91c1c; }
    .tag-tema { background: #dcfce7; color: #166534; }
    .question-image { display: block; width: 100%; max-width: 280px; height: auto; margin: 14px auto 0; border-radius: 12px; background: #0f172a; }
    .result-thumb { display: block; margin-top: 8px; max-width: 120px; height: auto; border-radius: 8px; }
    .answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    button { border: 0; border-radius: 12px; background: #e9efff; color: #173b8c; cursor: pointer; font-size: 1.15rem; font-weight: 700; padding: 17px; transition: background .2s, transform .2s; }
    button:hover, button:focus-visible { background: #ccdafe; transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid #5d8eff; outline-offset: 2px; }
    .result-list { display: grid; gap: 12px; text-align: left; }
    .result { border-radius: 12px; padding: 14px 16px; font-size: 1rem; line-height: 1.45; }
    .correct { background: #dcfce7; color: #166534; }
    .incorrect { background: #fee2e2; color: #b91c1c; }
    .result p { margin: 0; }
    .score { font-size: 1.2rem; margin: 0 0 24px; }
    .restart { margin-top: 26px; background: #2563eb; color: #fff; }
    .restart:hover, .restart:focus-visible { background: #1d4ed8; }
    .choice { display: grid; gap: 14px; }
    .choice-btn { display: block; width: 100%; padding: 22px; font-size: 1.5rem; }
    .choice-btn small { display: block; margin-top: 6px; font-size: .9rem; font-weight: 400; opacity: .8; }
    .btn-roma { background: #e9efff; }
    .btn-tema { background: #dcfce7; color: #166534; }
    .btn-tema:hover, .btn-tema:focus-visible { background: #bbf7d0; }
    .lesson { text-align: left; }
    .lesson h2 { text-align: center; }
    .theory { background: #f8fafc; border-radius: 12px; padding: 16px 18px; font-size: 1.05rem; line-height: 1.55; margin: 0 0 14px; }
    .theory p { margin: 0 0 10px; }
    .theory p:last-child { margin-bottom: 0; }
    .formula { display: block; margin-top: 8px; padding: 10px; background: #fff; border-radius: 8px; font-weight: 700; text-align: center; }
    .task-box { background: #fffbeb; border: 2px solid #fde68a; border-radius: 12px; padding: 16px 18px; font-size: 1.05rem; line-height: 1.5; margin: 0 0 14px; }
    .answer-box { background: #dcfce7; border-radius: 12px; padding: 16px 18px; font-size: 1.05rem; line-height: 1.5; margin: 0 0 14px; }
    .answer-hidden { display: none; }
    .show-answer { width: 100%; background: #fef3c7; color: #92400e; font-size: 1rem; padding: 13px; }
    .show-answer:hover, .show-answer:focus-visible { background: #fde68a; }
    .nav { display: flex; gap: 12px; margin-top: 18px; }
    .nav button { flex: 1; font-size: 1rem; padding: 14px; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover, .btn-secondary:focus-visible { background: #cbd5e1; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover, .btn-primary:focus-visible { background: #1d4ed8; }
    .to-start { margin-top: 14px; width: 100%; background: transparent; color: #64748b; font-size: .95rem; font-weight: 400; padding: 10px; }
    .to-start:hover, .to-start:focus-visible { background: #f1f5f9; transform: none; }
    .pic { background: #fff; border: 2px dashed #cbd5e1; border-radius: 12px; padding: 14px; margin: 0 0 14px; }
    .pic-caption { font-size: .9rem; color: #64748b; text-align: center; margin: 8px 0 0; }
    .bar-row { margin: 10px 0; text-align: left; font-size: .95rem; }
    .bar-label { font-weight: 700; margin-bottom: 4px; }
    .bar-track { background: #e2e8f0; border-radius: 8px; overflow: hidden; display: flex; height: 30px; }
    .bar-fill { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: .85rem; white-space: nowrap; }
    .bar-blue { background: #3b82f6; }
    .bar-green { background: #22c55e; }
    .bar-orange { background: #f59e0b; }
    .bar-red { background: #ef4444; }
    .bar-grey { background: #cbd5e1; color: #64748b; }
    .formula-pic { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; font-weight: 700; font-size: 1rem; }
    .chip { background: #eef2ff; border-radius: 10px; padding: 10px 12px; text-align: center; }
    .chip small { display: block; font-weight: 400; color: #64748b; margin-top: 4px; }
    .chip-green { background: #dcfce7; }
    .chip-yellow { background: #fef9c3; }
    .vs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .vs-col { border-radius: 10px; padding: 10px; background: #f8fafc; text-align: center; font-size: .95rem; line-height: 1.5; }
    .vs-col b { display: block; margin-bottom: 4px; }
    @media (max-width: 420px) { .card { padding: 30px 20px; } .answers { grid-template-columns: 1fr; } .nav { flex-direction: column; } .vs-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script>
    // ===== Рома: старый квиз (квадратные уравнения + Dota) =====
    const questions = [
      { text: 'Чему равен дискриминант уравнения', equation: 'x² − 5x + 6 = 0?', options: ['1', '5', '25', '49'], correct: '1' },
      { text: 'Сколько корней имеет квадратное уравнение, если', equation: 'D < 0?', options: ['0', '1', '2', 'Бесконечно много'], correct: '0' },
      { text: 'Какие корни уравнения', equation: 'x² − 9 = 0?', options: ['−3 и 3', '0 и 9', '3 и 6', '−9 и 9'], correct: '−3 и 3' },
      { text: 'Какой герой изображён на картинке?', image: 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/pudge.png', imageAlt: 'Герой Dota 2', options: ['Pudge', 'Invoker', 'Axe', 'Juggernaut'], correct: 'Pudge' },
      { text: 'Сколько разных корней у квадратного уравнения, если', equation: 'D = 0?', options: ['0', '1', '2', '3'], correct: '1' },
      { text: 'Чему равен дискриминант уравнения', equation: 'x² + 4x + 4 = 0?', options: ['0', '8', '16', '32'], correct: '0' },
      { text: 'Какие корни уравнения', equation: 'x² − 5x + 6 = 0?', options: ['2 и 3', '−2 и −3', '1 и 6', '−1 и −6'], correct: '2 и 3' },
      { text: 'Что делает предмет на картинке?', image: 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/blink.png', imageAlt: 'Предмет Blink Dagger', options: ['Телепортирует героя на короткую дистанцию', 'Даёт невидимость', 'Лечит 500 HP', 'Даёт иммунитет к магии'], correct: 'Телепортирует героя на короткую дистанцию' },
      { text: 'Чему равно произведение корней уравнения', equation: 'x² − 5x + 6 = 0?', options: ['6', '−6', '5', '−5'], correct: '6' },
      { text: 'Какие корни уравнения', equation: 'x² − 4x = 0?', options: ['0 и 4', '0 и −4', '2 и 2', '−2 и 2'], correct: '0 и 4' },
      { text: 'Какие корни уравнения', equation: 'x² − 25 = 0?', options: ['−5 и 5', '0 и 5', '−25 и 25', '5 и 10'], correct: '−5 и 5' },
      { text: 'Угадай героя по картинке', image: 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/juggernaut.png', imageAlt: 'Герой Dota 2', options: ['Juggernaut', 'Axe', 'Sven', 'Phantom Assassin'], correct: 'Juggernaut' },
      { text: 'Какие корни уравнения', equation: '2x² + 3x + 1 = 0?', options: ['−1 и −0,5', '1 и 0,5', '−2 и −1', '0 и −1'], correct: '−1 и −0,5' },
      { text: 'Чему равен старший коэффициент уравнения', equation: '3x² − 2x + 1 = 0?', options: ['3', '−2', '1', '0'], correct: '3' },
      { text: 'Чему равен свободный член уравнения', equation: '3x² − 2x + 1 = 0?', options: ['1', '3', '−2', '0'], correct: '1' },
      { text: 'Кто изображён на картинке?', image: 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/invoker.png', imageAlt: 'Герой Dota 2', options: ['Invoker', 'Zeus', 'Lina', 'Rubick'], correct: 'Invoker' },
      { text: 'Какие корни уравнения', equation: 'x² − 2x − 3 = 0?', options: ['3 и −1', '−3 и 1', '−3 и −1', '1 и 3'], correct: '3 и −1' },
      { text: 'По теореме Виета сумма корней приведённого уравнения', equation: 'x² + px + q = 0 равна?', options: ['−p', 'p', 'q', '−q'], correct: '−p' },
      { text: 'По теореме Виета произведение корней приведённого уравнения', equation: 'x² + px + q = 0 равно?', options: ['q', '−q', 'p', '−p'], correct: 'q' },
      { text: 'Что даёт предмет на картинке?', image: 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/black_king_bar.png', imageAlt: 'Предмет Black King Bar', options: ['Невосприимчивость к большинству заклинаний', 'Телепортацию', 'Невидимость', 'Возрождение'], correct: 'Невосприимчивость к большинству заклинаний' },
      { text: 'Какой формулой считают дискриминант', equation: 'ax² + bx + c = 0?', options: ['b² − 4ac', 'a² − 4bc', '2a + b', 'c² − ab'], correct: 'b² − 4ac' },
      { text: 'Чему равна сумма корней уравнения', equation: 'x² − 5x + 6 = 0?', options: ['5', '−5', '6', '−6'], correct: '5' },
      { text: 'Чему равен дискриминант уравнения', equation: '2x² + 3x + 1 = 0?', options: ['1', '9', '17', '−1'], correct: '1' },
      { text: 'Чему равен дискриминант уравнения', equation: 'x² − 2x − 3 = 0?', options: ['16', '4', '−8', '8'], correct: '16' },
      { text: 'Сколько корней имеет квадратное уравнение, если', equation: 'D > 0?', options: ['2', '1', '0', '3'], correct: '2' }
    ];

    // ===== Тёма: учебник по процентам (заготовка) =====
    const temaLessons = [
      {
        title: 'Шаг 1. Что значит «выросла на 40%»?',
        theory: `<p>Процент — это сотая часть. 100% — это всё, что было вначале.</p><p>Если цена <b>выросла на 40%</b>, значит к старым 100% добавили ещё 40%. Стало 140%.</p><p>Чтобы найти новое число, старое умножаем на 1,4:</p><span class="formula">новое = старое × 1,4</span><p style="margin-top:10px">Пример: билет стоил 100 рублей. 100 × 1,4 = 140 рублей.</p>`,
        pic: `<div class="bar-row"><div class="bar-label">Было: 100% = 200 руб.</div><div class="bar-track"><div class="bar-fill bar-blue" style="width:71%">100%</div></div></div><div class="bar-row"><div class="bar-label">Стало: 140% = 280 руб.</div><div class="bar-track"><div class="bar-fill bar-blue" style="width:71%">100%</div><div class="bar-fill bar-orange" style="width:29%">+40%</div></div></div><p class="pic-caption">Синяя часть — старая цена, оранжевая — добавка 40%</p>`,
        task: 'Билет стоил 200 рублей. Цена выросла на 40%. Сколько стал стоить билет?',
        answer: '200 × 1,4 = <b>280 рублей</b>.'
      },
      {
        title: 'Шаг 2. Что значит «снизилась на 16%»?',
        theory: `<p>Если что-то <b>снизилось на 16%</b>, от старых 100% осталось 100 − 16 = 84%.</p><p>Чтобы найти новое число, старое умножаем на 0,84:</p><span class="formula">новое = старое × 0,84</span><p style="margin-top:10px">Пример: выручка была 10 000 рублей. 10 000 × 0,84 = 8 400 рублей.</p>`,
        pic: `<div class="bar-row"><div class="bar-label">Было: 100% = 5 000 руб.</div><div class="bar-track"><div class="bar-fill bar-blue" style="width:100%">100%</div></div></div><div class="bar-row"><div class="bar-label">Стало: 84% = 4 200 руб.</div><div class="bar-track"><div class="bar-fill bar-green" style="width:84%">84% осталось</div><div class="bar-fill bar-grey" style="width:16%">−16%</div></div></div><p class="pic-caption">Зелёное — то, что осталось, серое — то, что пропало (16%)</p>`,
        task: 'Выручка была 5 000 рублей. Она снизилась на 16%. Сколько стала?',
        answer: '5 000 × 0,84 = <b>4 200 рублей</b>.'
      },
      {
        title: 'Шаг 3. Главная формула: выручка',
        theory: `<p><b>Выручка = цена билета × число зрителей.</b></p><p>Пример: билет 100 рублей, пришло 50 зрителей. Выручка = 100 × 50 = 5 000 рублей.</p><p>Если цена выросла, а зрителей столько же — выручка тоже вырастет. Если зрителей стало меньше — выручка упадёт.</p>`,
        pic: `<div class="formula-pic"><div class="chip">🎟️ Цена<small>руб. за билет</small></div><div>×</div><div class="chip">🧑‍🤝‍🧑 Зрители<small>число людей</small></div><div>=</div><div class="chip chip-green">💰 Выручка<small>все деньги</small></div></div><p class="pic-caption">Пример: 150 руб. × 40 зрителей = 6 000 руб.</p>`,
        task: 'Цена билета 150 рублей, пришло 40 зрителей. Какая выручка?',
        answer: '150 × 40 = <b>6 000 рублей</b>.'
      },
      {
        title: 'Шаг 4. Как найти зрителей?',
        theory: `<p>Из той же формулы получаем:</p><span class="formula">зрители = выручка / цена</span><p style="margin-top:10px">Пример: выручка 8 400 рублей, билет стоит 140 рублей. Зрителей = 8 400 / 140 = 60.</p>`,
        pic: `<div class="formula-pic"><div class="chip chip-yellow">💰 8 400 руб.<small>выручка</small></div><div>÷</div><div class="chip">🎟️ 140 руб.<small>цена</small></div><div>=</div><div class="chip chip-green">🧑 60<small>зрителей</small></div></div><p class="pic-caption">Делим все деньги на цену одного билета</p>`,
        task: 'Выручка 4 200 рублей, билет стоит 140 рублей. Сколько зрителей пришло?',
        answer: '4 200 / 140 = <b>30 зрителей</b>.'
      },
      {
        title: 'Шаг 5. Разбираем задачу про театр',
        theory: `<p><b>Задача:</b> цена билета выросла на 40%, а выручка снизилась на 16%. На сколько процентов уменьшилось число зрителей?</p><p>Решение по шагам:</p><p>1. Было: цена = Ц, зрителей = З, выручка = В = Ц × З.</p><p>2. Стало: цена = 1,4 × Ц, выручка = 0,84 × В.</p><p>3. Зрителей стало = выручка / цена = (0,84 × В) / (1,4 × Ц) = 0,6 × (В / Ц) = 0,6 × З.</p><p>4. Осталось 60%, значит уменьшилось на 100 − 60 = 40%.</p><p>Проверка на числах: было 100 руб. и 100 зрителей (выручка 10 000). Стало: цена 140 руб., выручка 8 400 руб. Зрителей = 8 400 / 140 = 60. Было 100, стало 60 — меньше на 40%.</p>`,
        pic: `<div class="vs-grid"><div class="vs-col"><b>🔵 Было</b>🎟️ 100 руб. (100%)<br>🧑 100 зрителей (100%)<br>💰 10 000 руб. (100%)</div><div class="vs-col" style="background:#fef9c3"><b>🟠 Стало</b>🎟️ 140 руб. (+40%)<br>🧑 60 зрителей (−40%)<br>💰 8 400 руб. (−16%)</div></div><div class="bar-row"><div class="bar-label">Зрители: было 100% → стало 60%</div><div class="bar-track"><div class="bar-fill bar-green" style="width:60%">60% осталось</div><div class="bar-fill bar-red" style="width:40%">40% ушло</div></div></div><p class="pic-caption">Цена выросла, а людей пришло так мало, что денег стало меньше</p>`,
        task: 'Итак, на сколько процентов уменьшилось число зрителей?',
        answer: 'На <b>40%</b> (осталось 60% зрителей).'
      },
      {
        title: 'Шаг 6. Проверь себя',
        theory: `<p>Попробуй похожие задачи. Сначала реши сам, потом открой ответ.</p><p>1. Цена выросла на 25%, а выручка не изменилась. На сколько упало число зрителей?</p><p>2. Цена снизилась на 20%, а выручка выросла на 20%. Что стало со зрителями?</p>`,
        pic: `<div class="bar-row"><div class="bar-label">Задача 1: цена 125%, выручка 100% → зрители 80%</div><div class="bar-track"><div class="bar-fill bar-green" style="width:80%">80% осталось</div><div class="bar-fill bar-grey" style="width:20%">−20%</div></div></div><div class="bar-row"><div class="bar-label">Задача 2: цена 80%, выручка 120% → зрители 150%</div><div class="bar-track"><div class="bar-fill bar-blue" style="width:53%">было 100%</div><div class="bar-fill bar-orange" style="width:33%">+50%</div></div></div><p class="pic-caption">Подсказка-картинка: дели выручку на цену</p>`,
        task: 'Реши обе задачи. Подсказка: используй формулу зрители = выручка / цена.',
        answer: '1. 1 / 1,25 = 0,8 — осталось 80%, упало на <b>20%</b>.<br>2. 1,2 / 0,8 = 1,5 — стало 150%, выросло на <b>50%</b>.'
      }
    ];

    const app = document.querySelector('#app');
    let currentQuestion = 0;
    let answers = [];
    let currentTema = 0;

    function showStart() {
      app.innerHTML = `
        <section class="card">
          <h1>Проверка математики</h1>
          <p class="subtitle">Выбери, кто проходит:</p>
          <div class="choice">
            <button type="button" class="choice-btn btn-roma" data-who="roma">Рома<small>квадратные уравнения + Dota 2 (25 вопросов)</small></button>
            <button type="button" class="choice-btn btn-tema" data-who="tema">Тёма<small>проценты: задача про театр (учебник)</small></button>
          </div>
        </section>`;
      app.querySelectorAll('[data-who]').forEach(button => {
        button.addEventListener('click', () => {
          button.dataset.who === 'roma' ? startRoma() : startTema();
        });
      });
    }

    function startRoma() { currentQuestion = 0; answers = []; showQuestion(); }
    function startTema() { currentTema = 0; showTemaLesson(); }

    function formatQuestion(question) {
      return question.equation
        ? `${question.text}<span class="equation">${question.equation}</span>`
        : question.text;
    }
    function questionImage(question, cls) {
      return question.image
        ? `<img class="${cls}" src="${question.image}" alt="${question.imageAlt || 'Картинка к вопросу'}" loading="lazy">`
        : '';
    }
    function isDota(question) { return Boolean(question.image); }

    function showQuestion() {
      const question = questions[currentQuestion];
      app.innerHTML = `
        <section class="card">
          <p class="progress">Рома • Вопрос ${currentQuestion + 1} из ${questions.length}</p>
          <h1>${isDota(question) ? 'Dota 2' : 'Квадратные уравнения'}</h1>
          <p style="margin: 0 0 16px;"><span class="tag ${isDota(question) ? 'tag-dota' : ''}">${isDota(question) ? 'DOTA 2' : 'МАТЕМАТИКА'}</span></p>
          <p class="question">${formatQuestion(question)}${questionImage(question, 'question-image')}</p>
          <div class="answers">
            ${question.options.map(option => `<button type="button" data-answer="${option}">${option}</button>`).join('')}
          </div>
          <button class="to-start" type="button" data-go="start">← К выбору</button>
        </section>`;
      app.querySelectorAll('[data-answer]').forEach(button => {
        button.addEventListener('click', () => chooseAnswer(button.dataset.answer));
      });
      app.querySelector('[data-go="start"]').addEventListener('click', showStart);
    }

    function chooseAnswer(answer) {
      answers.push(answer);
      currentQuestion += 1;
      currentQuestion < questions.length ? showQuestion() : showResults();
    }

    function showResults() {
      const correctCount = answers.filter((answer, index) => answer === questions[index].correct).length;
      app.innerHTML = `
        <section class="card">
          <h1>Результат</h1>
          <p class="score">Правильных ответов: ${correctCount} из ${questions.length}</p>
          <div class="result-list">
            ${questions.map((question, index) => {
              const isCorrect = answers[index] === question.correct;
              return `<article class="result ${isCorrect ? 'correct' : 'incorrect'}">
                <p><strong>${index + 1}. ${formatQuestion(question)}</strong>${questionImage(question, 'result-thumb')}</p>
                <p>Ваш ответ: ${answers[index]}. Правильный ответ: ${question.correct}.</p>
              </article>`;
            }).join('')}
          </div>
          <div class="nav">
            <button class="btn-secondary" type="button" data-go="retry">Пройти ещё раз</button>
            <button class="btn-primary" type="button" data-go="start">К выбору</button>
          </div>
        </section>`;
      app.querySelector('[data-go="retry"]').addEventListener('click', startRoma);
      app.querySelector('[data-go="start"]').addEventListener('click', showStart);
    }

    function showTemaLesson() {
      const lesson = temaLessons[currentTema];
      const isLast = currentTema === temaLessons.length - 1;
      const isFirst = currentTema === 0;
      app.innerHTML = `
        <section class="card lesson">
          <p class="progress">Тёма • Урок ${currentTema + 1} из ${temaLessons.length}</p>
          <p style="margin: 0 0 12px; text-align:center;"><span class="tag tag-tema">ПРОЦЕНТЫ</span></p>
          <h2>${lesson.title}</h2>
          <div class="theory">${lesson.theory}</div>
          ${lesson.pic ? `<div class="pic">${lesson.pic}</div>` : ''}
          <div class="task-box"><b>Задание:</b> ${lesson.task}</div>
          <div class="answer-box answer-hidden" id="tema-answer"><b>Ответ:</b> ${lesson.answer}</div>
          <button class="show-answer" type="button" id="tema-toggle">Показать ответ</button>
          <div class="nav">
            <button class="btn-secondary" type="button" id="tema-prev" ${isFirst ? 'disabled style="opacity:.5"' : ''}>← Назад</button>
            <button class="btn-primary" type="button" id="tema-next">${isLast ? 'К выбору' : 'Дальше →'}</button>
          </div>
          <button class="to-start" type="button" id="tema-start">← К выбору Рома / Тёма</button>
        </section>`;
      const answerBox = app.querySelector('#tema-answer');
      const toggleBtn = app.querySelector('#tema-toggle');
      toggleBtn.addEventListener('click', () => {
        const hidden = answerBox.classList.toggle('answer-hidden');
        toggleBtn.textContent = hidden ? 'Показать ответ' : 'Скрыть ответ';
      });
      app.querySelector('#tema-prev').addEventListener('click', () => {
        if (currentTema > 0) { currentTema -= 1; showTemaLesson(); }
      });
      app.querySelector('#tema-next').addEventListener('click', () => {
        if (isLast) { showStart(); } else { currentTema += 1; showTemaLesson(); }
      });
      app.querySelector('#tema-start').addEventListener('click', showStart);
    }

    showStart();
  </script>
</body>
</html>
